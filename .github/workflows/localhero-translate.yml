name: Localhero.ai - Automatic I18n translation

on:
  pull_request:
    paths:
      - "src/**/*.ts"
      - "src/**/*.tsx"
      - "src/**/*.js"
      - "src/**/*.jsx"
      - "src/locales/**"
      - "localhero.json"
  repository_dispatch:
    types: [localhero-sync]
  workflow_dispatch:

concurrency:
  group: translate-${{ github.event.client_payload.branch || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  translate:
    # Pull requests from forks get no secrets, so skip them instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.branch || github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: github.event_name == 'pull_request' && github.actor != 'localhero-ai[bot]'
        with:
          node-version: '22'

      - name: Extract messages
        if: github.event_name == 'pull_request' && github.actor != 'localhero-ai[bot]'
        run: |
          npm ci
          npx lingui extract

      - uses: localheroai/localhero-action@v1
        with:
          api-key: ${{ secrets.LOCALHERO_API_KEY }}
